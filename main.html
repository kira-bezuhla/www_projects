<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Characters</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .character-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .character-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .character-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.2);
        }
        
        .character-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        
        .character-info {
            padding: 15px;
            text-align: center;
        }
        
        .character-info h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .character-info p {
            color: #666;
            font-size: 0.9em;
        }
        
        /* Detail Page Styles */
        .detail-container {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .detail-container.active {
            display: grid;
        }
        
        .detail-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .detail-section img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .detail-info h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }
        
        .detail-info p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        .ratings {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }
        
        .rating-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            align-items: center;
        }
        
        .rating-item label {
            font-weight: bold;
            color: #333;
        }
        
        .rating-bar {
            width: 200px;
            height: 8px;
            background: #ddd;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .rating-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
        }
        
        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
            margin-top: 20px;
        }
        
        .back-btn:hover {
            background: #764ba2;
        }
        
        .list-view.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- List View -->
        <div class="list-view">
            <h1>Characters</h1>
            <div class="character-list" id="characterList"></div>
        </div>
        
        <!-- Detail View -->
        <div class="detail-container" id="detailContainer">
            <div class="detail-section">
                <img id="detailImg" src="" alt="">
            </div>
            <div class="detail-section detail-info">
                <h2 id="detailName"></h2>
                <p id="detailDescription"></p>
                <div class="ratings" id="ratingsContainer"></div>
                <button class="back-btn" onclick="goBack()">Back to List</button>
            </div>
        </div>
    </div>
    
    <script>
        // Sample character data
        const characters = [
            {
                id: 1,
                name: "Aragorn",
                description: "A ranger and the heir to the throne of Gondor. Brave, noble, and determined to reclaim his kingdom.",
                image: "https://via.placeholder.com/300x250?text=Aragorn",
                ratings: {
                    "Strength": 95,
                    "Intelligence": 85,
                    "Charisma": 90,
                    "Speed": 80
                }
            },
            {
                id: 2,
                name: "Legolas",
                description: "An Elven archer with unmatched precision and grace. A loyal companion with sharp eyes and sharper arrows.",
                image: "https://via.placeholder.com/300x250?text=Legolas",
                ratings: {
                    "Archery": 100,
                    "Speed": 95,
                    "Agility": 98,
                    "Strength": 85
                }
            },
            {
                id: 3,
                name: "Gimli",
                description: "A dwarf warrior with a heart of gold beneath his gruff exterior. Master of the axe and a true friend.",
                image: "https://via.placeholder.com/300x250?text=Gimli",
                ratings: {
                    "Strength": 100,
                    "Durability": 95,
                    "Mining": 98,
                    "Humor": 90
                }
            },
            {
                id: 4,
                name: "Frodo",
                description: "A young hobbit with an unexpected destiny. Small in size but immense in courage and determination.",
                image: "https://via.placeholder.com/300x250?text=Frodo",
                ratings: {
                    "Courage": 90,
                    "Resilience": 95,
                    "Wisdom": 85,
                    "Speed": 70
                }
            }
        ];
        
        function renderCharacterList() {
            const list = document.getElementById('characterList');
            list.innerHTML = characters.map(char => `
                <div class="character-card" onclick="showDetail(${char.id})">
                    <img src="${char.image}" alt="${char.name}">
                    <div class="character-info">
                        <h3>${char.name}</h3>
                        <p>Click to view details</p>
                    </div>
                </div>
            `).join('');
        }
        
        function showDetail(characterId) {
            const char = characters.find(c => c.id === characterId);
            if (!char) return;
            
            document.querySelector('.list-view').classList.add('hidden');
            
            document.getElementById('detailImg').src = char.image;
            document.getElementById('detailImg').alt = char.name;
            document.getElementById('detailName').textContent = char.name;
            document.getElementById('detailDescription').textContent = char.description;
            
            const ratingsContainer = document.getElementById('ratingsContainer');
            ratingsContainer.innerHTML = Object.entries(char.ratings).map(([key, value]) => `
                <div class="rating-item">
                    <label>${key}</label>
                    <div class="rating-bar">
                        <div class="rating-fill" style="width: ${value}%"></div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('detailContainer').classList.add('active');
        }
        
        function goBack() {
            document.getElementById('detailContainer').classList.remove('active');
            document.querySelector('.list-view').classList.remove('hidden');
        }
        
        renderCharacterList();
    </script>
</body>
</html>
