<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contacts.css">


</head>

<body>
    <header>
        <nav>
            <h1><a href="index.html">
                    Strona Główna
                </a></h1>
        </nav>
    </header>
    <section id="contact">
        <div class="contact-container">
            <h3>Kontakt</h3>
            <p>Jeśli masz pytania lub chcesz się z nami skontaktować, prosimy o wypełnienie poniższego formularza:</p>
            <form action="" method="get" class="form">

                <div class="input-fields">
                    <div class="row">
                        <div class="col">
                            <label for="fieldName" class="form-label">Imię i nazwisko:</label>
                            <input type="text" class="form-control" id="fieldName" placeholder="Jan Kowalski">

                            <label for="fieldEmail" class="form-label">Email:</label>
                            <input type="email" class="form-control" id="fieldEmail" placeholder="name@example.com">

                        </div>
                        <div class="col">
                            <label for="fieldSelect" class="form-label">Płeć:</label>
                            <select class="form-control" id="fieldSelect">
                                <option selected>Wybierz…</option>
                                <option value="1">Kobieta</option>
                                <option value="2">Mężczyzna</option>
                                <option value="3">Inne</option>
                            </select>
                        </div>
                    </div>

                </div>

                <div class="text">
                    <label for="fieldText" class="form-label">Prosimy o wiadomość:</label>
                    <textarea class="form-control" id="fieldText" rows="3"></textarea>

                </div>

                <button type="button" class="btn-solid theme-primary btn-lg">Wyślij wiadomość</button>

            </form>
        </div>

    </section>


    <footer>
        <p>&copy; 2026 made by Kubyk. Wszelkie prawa zastrzeżone.</p>
        <p><a href="contact.html">Kontakty</a></p>
    </footer>
</body>
